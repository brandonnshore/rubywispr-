name: Web CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  npm-validation:
    name: npm validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Check docs
        run: npm run docs:check

      - name: Build
        run: npm run build

      # macOS validation is enforced separately by macOS CI when app paths change.
